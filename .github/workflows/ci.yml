name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, so tests run on each target, not just compile (D18: no Windows).
          - target: linux/amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check target
        run: test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.target }}"
      - name: Build
        run: make build
      - name: Test
        run: go test -timeout 5m ./...
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.runner }}
          path: bin/atlas
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: go.mod is tidy
        run: go mod tidy -diff
